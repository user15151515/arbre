<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arbre Genealògic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f4ee;--surface:#fff;--surface2:#f0ece3;
  --border:#d9d2c4;--border2:#c4baa8;
  --text:#1a1712;--text2:#6b6355;--text3:#9c9183;
  --accent:#7c5c3e;--accent-light:#f0e8dc;
  --gold:#c4933a;--danger:#8b3a3a;
  --shadow:0 2px 12px rgba(60,40,20,.10);
  --shadow-lg:0 6px 32px rgba(60,40,20,.16);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;z-index:100}
.topbar-logo{font-family:'Playfair Display',serif;font-size:18px;color:var(--accent);margin-right:8px}
.topbar-logo span{color:var(--gold);font-style:italic}
.topbar-sep{width:1px;height:24px;background:var(--border)}
.tb-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;border-radius:7px;cursor:pointer;transition:all .15s;white-space:nowrap}
.tb-btn:hover{background:var(--surface2);border-color:var(--border2);color:var(--text)}
.tb-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tb-btn.primary:hover{background:#6a4d33}
.tb-btn svg{width:15px;height:15px;flex-shrink:0}
.tb-spacer{flex:1}
.zoom-controls{display:flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:3px}
.z-btn{width:28px;height:28px;border:none;background:transparent;cursor:pointer;border-radius:5px;font-size:16px;color:var(--text2);display:flex;align-items:center;justify-content:center;transition:all .1s}
.z-btn:hover{background:var(--surface);color:var(--text)}
.z-label{font-size:12px;color:var(--text3);min-width:38px;text-align:center}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#bbb;transition:background .4s;flex-shrink:0}
.sync-dot.ok{background:#5a9a5a}
.sync-dot.busy{background:var(--gold);animation:blink .7s infinite}
.sync-dot.err{background:var(--danger)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.sync-lbl{font-size:11px;color:var(--text3)}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;z-index:10;transition:width .25s ease}
.sidebar.collapsed{width:0}
.sidebar-inner{width:260px;display:flex;flex-direction:column;height:100%;overflow:hidden}
.sidebar-header{padding:14px 12px 10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sidebar-title{font-family:'Playfair Display',serif;font-size:14px;color:var(--text2);letter-spacing:.03em;text-transform:uppercase}
.hide-btn{width:26px;height:26px;border:1px solid var(--border);background:var(--surface2);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text3);transition:all .12s}
.hide-btn:hover{background:var(--border);color:var(--text2)}
.search-wrap{padding:10px 12px;border-bottom:1px solid var(--border);position:relative;flex-shrink:0}
.search-icon{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.search-input{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--border);background:var(--surface2);border-radius:7px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);outline:none}
.search-input:focus{border-color:var(--accent)}
.person-list{flex:1;overflow-y:auto;padding:8px}
.person-list::-webkit-scrollbar{width:4px}
.person-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.plist-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:background .12s;margin-bottom:2px}
.plist-item:hover{background:var(--surface2)}
.plist-item.active{background:var(--accent-light)}
.plist-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--accent);flex-shrink:0;overflow:hidden}
.plist-avatar img{width:100%;height:100%;object-fit:cover}
.plist-name{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plist-dates{font-size:11px;color:var(--text3)}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);flex-shrink:0}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat-box{background:var(--surface2);border-radius:8px;padding:8px 10px;text-align:center}
.stat-num{font-size:18px;font-weight:500;color:var(--accent)}
.stat-label{font-size:11px;color:var(--text3)}
.panel-reopen-btn{position:absolute;left:12px;top:12px;z-index:200;width:36px;height:36px;border-radius:9px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);cursor:pointer;display:none;align-items:center;justify-content:center;color:var(--text2);transition:all .15s}
.panel-reopen-btn:hover{background:var(--accent-light);border-color:var(--border2);color:var(--accent)}
.panel-reopen-btn.visible{display:flex}
.canvas-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg)}
.canvas-grid{position:absolute;inset:0;background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);background-size:28px 28px;opacity:.5;pointer-events:none}
#tree-canvas{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
.tree-viewport{position:absolute;top:0;left:0;transform-origin:0 0}
.person-node{position:absolute;width:140px;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:14px 12px 12px;cursor:grab;transition:box-shadow .18s,border-color .18s,transform .12s;box-shadow:var(--shadow);text-align:center}
.person-node:hover{box-shadow:var(--shadow-lg);border-color:var(--border2)}
.person-node.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,62,.18),var(--shadow-lg)}
.person-node.dragging{cursor:grabbing;z-index:999;box-shadow:var(--shadow-lg);transform:scale(1.03)}
/* Selection mode: nodes pulse to invite clicking */
.person-node.pick-mode{cursor:crosshair;border-color:var(--gold);animation:pickPulse 1.2s infinite}
@keyframes pickPulse{0%,100%{box-shadow:0 0 0 0 rgba(196,147,58,.4)}60%{box-shadow:0 0 0 6px rgba(196,147,58,0)}}
.node-avatar{width:52px;height:52px;border-radius:50%;margin:0 auto 8px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:500;color:var(--accent);overflow:hidden;border:2px solid var(--border);position:relative}
.node-avatar img{width:100%;height:100%;object-fit:cover}
.node-avatar .upload-hint{display:none}
.deceased-avatar{filter:grayscale(45%);opacity:.88}
.node-name{font-family:'Playfair Display',serif;font-size:13px;font-weight:600;color:var(--text);line-height:1.3;margin-bottom:3px}
.node-dates{font-size:10.5px;color:var(--text3);display:flex;align-items:center;justify-content:center;gap:3px}
.deceased-cross{display:inline-flex;align-items:center;opacity:.65}
.node-actions{display:flex;gap:4px;justify-content:center;margin-top:8px;opacity:0;transition:opacity .15s}
.person-node:hover .node-actions{opacity:1}
.node-action-btn{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s;color:var(--text2)}
.node-action-btn:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}
.node-action-btn.del:hover{background:#fde8e8;border-color:var(--danger);color:var(--danger)}
.connector-line{fill:none;stroke:var(--border2);stroke-width:1.8}
.connector-couple{fill:none;stroke:var(--gold);stroke-width:1.8;stroke-dasharray:5 3}
.gender-tag{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:3px;flex-shrink:0}
.gender-m{background:#5b7fad}
.gender-f{background:#b56d8a}
.gender-o{background:var(--border2)}
.legend{position:absolute;bottom:16px;left:16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;z-index:50;font-size:11px;color:var(--text2)}
.legend-row{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.legend-row:last-child{margin-bottom:0}
.leg-line{width:24px;height:2px;background:var(--border2)}
/* PICK MODE BANNER */
.pick-banner{
  position:fixed;top:56px;left:0;right:0;z-index:1500;
  background:var(--gold);color:#fff;
  display:none;align-items:center;justify-content:space-between;
  padding:10px 20px;font-size:14px;font-weight:500;
  box-shadow:0 2px 12px rgba(60,40,20,.2);
}
.pick-banner.active{display:flex}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(30,25,18,.55);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border-radius:18px;width:480px;max-width:95vw;box-shadow:var(--shadow-lg);transform:translateY(12px);transition:transform .2s;max-height:90vh;overflow-y:auto}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-header{padding:22px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:'Playfair Display',serif;font-size:18px;color:var(--text)}
.modal-close{width:30px;height:30px;border:1px solid var(--border);background:var(--surface2);border-radius:7px;cursor:pointer;font-size:16px;color:var(--text2);display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--border)}
.modal-body{padding:20px 24px}
.form-row{margin-bottom:16px}
.form-row label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px;letter-spacing:.04em;text-transform:uppercase}
.form-row input,.form-row select{width:100%;padding:9px 12px;border:1px solid var(--border);background:var(--surface2);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border .15s}
.form-row input:focus,.form-row select:focus{border-color:var(--accent)}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photo-upload-area{width:80px;height:80px;border-radius:50%;background:var(--accent-light);border:2px dashed var(--border2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;margin:0 auto 16px;transition:border-color .15s}
.photo-upload-area:hover{border-color:var(--accent)}
.photo-upload-text{font-size:10px;color:var(--text3);text-align:center;margin-top:4px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.btn{padding:9px 20px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text2);transition:all .15s}
.btn:hover{background:var(--border);color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#6a4d33}
.ctx-menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);z-index:2000;min-width:180px;padding:6px;display:none}
.ctx-menu.open{display:block}
.ctx-item{padding:8px 12px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--text);display:flex;align-items:center;gap:8px;transition:background .1s}
.ctx-item:hover{background:var(--surface2)}
.ctx-item.danger{color:var(--danger)}
.ctx-item.danger:hover{background:#fde8e8}
.ctx-sep{height:1px;background:var(--border);margin:4px 0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:10px 20px;border-radius:9px;font-size:13px;z-index:3000;transition:transform .3s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.loading-overlay{position:fixed;inset:0;background:rgba(247,244,238,.92);z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.loading-overlay.hidden{display:none}
.loading-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:var(--text2)}
/* REL PANEL */
.rp-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.rp-section-title{display:flex;align-items:center;gap:6px}
.rp-add-btn{display:flex;align-items:center;gap:4px;padding:3px 10px;border:1px solid var(--border);background:transparent;border-radius:20px;font-size:11px;font-weight:500;color:var(--text3);cursor:pointer;transition:all .12s;font-family:'DM Sans',sans-serif}
.rp-add-btn:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}
.rp-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:9px;background:var(--surface2);margin-bottom:5px;cursor:pointer;transition:background .12s}
.rp-row:hover{background:var(--border)}
.rp-del{width:22px;height:22px;border:none;background:transparent;cursor:pointer;color:var(--text3);display:flex;align-items:center;justify-content:center;border-radius:4px;padding:0;flex-shrink:0;transition:color .1s}
.rp-del:hover{color:var(--danger)}
.rp-empty{font-size:12px;color:var(--text3);padding:4px 0 8px}
/* RECT SELECT */
#rect-sel{position:absolute;border:2px solid var(--accent);background:rgba(124,92,62,.08);pointer-events:none;display:none;z-index:800}
.person-node.in-sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,62,.22)}
/* FAMILY FOCUS */
.person-node.ff-focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,62,.18),var(--shadow-lg)}
.person-node.ff-ancestor{border-color:var(--gold);box-shadow:0 0 0 3px rgba(196,147,58,.2)}
.ff-banner{position:fixed;top:56px;left:0;right:0;z-index:1400;background:var(--accent);color:#fff;display:none;align-items:center;justify-content:space-between;padding:9px 20px;font-size:13px;font-weight:500;box-shadow:0 2px 10px rgba(60,40,20,.18)}
.ff-banner.active{display:flex}
/* LINE MODE TOGGLE */
.tb-seg{display:flex;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:7px;overflow:hidden}
.tb-seg button{padding:5px 11px;border:none;background:transparent;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:var(--text2);transition:all .15s;white-space:nowrap}
.tb-seg button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(60,40,20,.10)}
.tb-seg button:hover:not(.active){color:var(--text)}
/* GENERATION SNAP LINES */
.gen-line{position:absolute;left:0;right:0;pointer-events:none;border-top:1px dashed var(--border2);opacity:0;transition:opacity .15s;z-index:1}
.gen-line.snap-active{border-top-color:var(--accent);opacity:1 !important}
.gen-line-label{position:absolute;right:8px;top:-18px;font-size:10px;color:var(--text3);font-family:'DM Sans',sans-serif;background:var(--bg);padding:1px 5px;border-radius:4px;opacity:0;transition:opacity .15s}
#snap-overlay{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
/* snap ghost indicator */
.snap-ghost{position:absolute;left:0;right:0;height:2px;background:var(--accent);opacity:0;pointer-events:none;z-index:900;transition:opacity .1s}
.snap-ghost.show{opacity:.7}
/* FAMILY FOCUS extra */
.person-node.ff-child{border-color:#5b7fad;box-shadow:0 0 0 3px rgba(91,127,173,.2)}
</style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loading-text">Connectant amb Firestore...</div>
</div>

<!-- PICK MODE BANNER -->
<div class="pick-banner" id="pick-banner">
  <span id="pick-label">Clica una persona de l'arbre</span>
  <button onclick="cancelPickMode()" style="background:rgba(255,255,255,.25);border:none;border-radius:6px;padding:5px 14px;color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer">Cancel·lar</button>
</div>

<!-- FAMILY FOCUS BANNER -->
<div class="ff-banner" id="ff-banner">
  <span id="ff-label">Vista familiar</span>
  <button onclick="closeFamilyFocus()" style="background:rgba(255,255,255,.25);border:none;border-radius:6px;padding:5px 14px;color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer">Tancar vista</button>
</div>

<div class="topbar">
  <div class="topbar-logo">Arbre</div>
  <div class="topbar-sep"></div>
  <button class="tb-btn primary" onclick="openAddModal()">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="3" x2="8" y2="13"/><line x1="3" y1="8" x2="13" y2="8"/></svg>
    Nova persona
  </button>
  <button class="tb-btn" onclick="openRelPanel()" id="btn-rel">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="4" cy="8" r="2.5"/><circle cx="12" cy="8" r="2.5"/><line x1="6.5" y1="8" x2="9.5" y2="8"/></svg>
    Relacions
  </button>
  <div class="topbar-sep"></div>
  <button class="tb-btn" onclick="autoLayout()">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
    Auto-ordenar
  </button>
  <button class="tb-btn" onclick="saveLayoutAsDefault()">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 2h9l3 3v9H2z"/><rect x="5" y="9" width="6" height="5"/><rect x="4" y="2" width="5" height="4"/></svg>
    Desa vista
  </button>
  <button class="tb-btn" onclick="exportData()">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3v8m-3-3 3 3 3-3"/><path d="M3 12h10"/></svg>
    Exportar
  </button>
  <div class="topbar-sep"></div>
  <div class="tb-seg" title="Tipus de línies">
    <button id="btn-curved" class="active" onclick="setLineMode('curved')">&#8767; Corbes</button>
    <button id="btn-straight" onclick="setLineMode('straight')">&#x250C; Rectes</button>
  </div>
  <button class="tb-btn" id="btn-ff" onclick="openFamilyFocus()">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="5" r="2.5"/><path d="M3 14c0-4 10-4 10 0"/><path d="M1.5 7.5l2.5-3m8 0l2.5 3"/></svg>
    Vista familiar
  </button>
  <button class="tb-btn" id="btn-snap" onclick="toggleSnap()" title="Ajust automàtic per generació">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/><circle cx="8" cy="8" r="2" fill="currentColor" stroke="none"/></svg>
    Snap gen.
  </button>
  <div class="tb-spacer"></div>
  <div style="display:flex;align-items:center;gap:6px">
    <div class="sync-dot" id="sync-dot"></div>
    <span class="sync-lbl" id="sync-lbl">–</span>
  </div>
  <div class="topbar-sep"></div>
  <div class="zoom-controls">
    <button class="z-btn" onclick="zoomOut()">−</button>
    <span class="z-label" id="zoom-label">100%</span>
    <button class="z-btn" onclick="zoomIn()">+</button>
    <button class="z-btn" onclick="resetZoom()">⟳</button>
  </div>
</div>

<div class="main">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-inner">
      <div class="sidebar-header">
        <div class="sidebar-title">Persones</div>
        <button class="hide-btn" onclick="toggleSidebar()" title="Amaga el tauler">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="10,4 6,8 10,12"/></svg>
        </button>
      </div>
      <div class="search-wrap">
        <span class="search-icon"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6.5" cy="6.5" r="4.5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/></svg></span>
        <input class="search-input" type="text" placeholder="Cercar..." oninput="filterList()" id="search-input">
      </div>

// ── PICK MODE ──
let pickMode = null;

function startPickMode(relType, label) {
  console.log('[PICK] Starting pick mode:', relType, label);
  pickMode = { relType };
  document.getElementById('pick-banner').classList.add('active');
  document.getElementById('pick-label').textContent = label;
  // Hide the overlay entirely so it cannot intercept canvas clicks
  document.getElementById('rel-panel-overlay').style.display = 'none';
  document.querySelectorAll('.person-node').forEach(n => n.classList.add('pick-mode'));
}

function cancelPickMode() {
  console.log('[PICK] Cancelled');
  pickMode = null;
  document.getElementById('pick-banner').classList.remove('active');
  // Restore overlay if panel is still open
  if (relPanelOpen) document.getElementById('rel-panel-overlay').style.display = 'block';
  document.querySelectorAll('.person-node').forEach(n => n.classList.remove('pick-mode'));
}

function handlePickClick(clickedId) {
  console.log('[PICK] handlePickClick called, clickedId=', clickedId, 'pickMode=', pickMode);
  if (!pickMode) { console.warn('[PICK] pickMode is null, ignoring'); return; }
  // Family focus intercept
  if(pickMode.relType==='__ff__'){
    cancelPickMode();
    applyFamilyFocus(clickedId);
    return;
  }
  const personId = document.getElementById('rp-person').value;
  const { relType } = pickMode;
  console.log('[PICK] personId=', personId, 'relType=', relType);
  cancelPickMode();

  if (clickedId === personId) { showToast('No pots relacionar-te amb tu mateix'); return; }

  let relData;
  if (relType === 'couple') {
    const dup = relations.find(r => r.type==='couple' && ((r.a===personId&&r.b===clickedId)||(r.a===clickedId&&r.b===personId)));
    if (dup) { showToast('La relació ja existeix'); return; }
    relData = { type:'couple', a:personId, b:clickedId, date:'' };
  } else if (relType === 'parent-child') {
    const dup = relations.find(r => r.type==='parent-child' && r.a===personId && r.b===clickedId);
    if (dup) { showToast('La relació ja existeix'); return; }
    relData = { type:'parent-child', a:personId, b:clickedId, date:'' };
  } else if (relType === 'parent-child-reverse') {
    const dup = relations.find(r => r.type==='parent-child' && r.a===clickedId && r.b===personId);
    if (dup) { showToast('La relació ja existeix'); return; }
    relData = { type:'parent-child', a:clickedId, b:personId, date:'' };
  }
  if (relData) { console.log('[PICK] Saving relation:', relData); dbSaveRelation(relData); showToast('Relació afegida'); }
}

// ── SYNC ──
function setSyncStatus(s,m){
  document.getElementById('sync-dot').className='sync-dot '+s;
  document.getElementById('sync-lbl').textContent=m;
}

// ── FIRESTORE ──
function startListening(){
  setSyncStatus('busy','Carregant...');
  db.collection('people').onSnapshot(snap=>{
    people={};
    snap.forEach(doc=>{ people[doc.id]={id:doc.id,...doc.data()}; });
    if(snap.empty){ seedInitialData(); return; }
    renderAll(); setSyncStatus('ok','Sincronitzat'); hideLoading();
  },err=>{ setSyncStatus('err','Error de connexió'); hideLoading(); showToast('Error en connectar'); });

  db.collection('relations').onSnapshot(snap=>{
    relations=[];
    snap.forEach(doc=>{ relations.push({firestoreId:doc.id,...doc.data()}); });
    renderConnectors();
    if(relPanelOpen) renderRelPanel();
  });
}

function hideLoading(){ document.getElementById('loading').classList.add('hidden'); }

async function seedInitialData(){
  document.getElementById('loading-text').textContent='Creant arbre inicial...';
  setSyncStatus('busy','Desant...');
  try{
    const b=db.batch();
    b.set(db.collection('people').doc('p-monica'),{name:'Mónica',surname:'Álvarez',birth:'',death:'',gender:'f',birthplace:'',photo:null,x:80,y:80});
    b.set(db.collection('people').doc('p-xavier'),{name:'Xavier',surname:'Pont',birth:'',death:'',gender:'m',birthplace:'',photo:null,x:280,y:80});
    b.set(db.collection('people').doc('p-ares'),{name:'Ares',surname:'Pont',birth:'',death:'',gender:'f',birthplace:'',photo:null,x:80,y:300});
    b.set(db.collection('people').doc('p-jana'),{name:'Jana',surname:'Pont',birth:'',death:'',gender:'f',birthplace:'',photo:null,x:280,y:300});
    await b.commit();
    await db.collection('relations').add({type:'couple',a:'p-monica',b:'p-xavier',date:''});
    await db.collection('relations').add({type:'parent-child',a:'p-monica',b:'p-ares',date:''});
    await db.collection('relations').add({type:'parent-child',a:'p-monica',b:'p-jana',date:''});
    showToast('Arbre inicial creat');
  }catch(e){ setSyncStatus('err','Error'); showToast('Error en crear dades'); hideLoading(); }
}

async function dbSavePerson(p){
  setSyncStatus('busy','Desant...');
  try{ const{id,...d}=p; await db.collection('people').doc(id).set(d); setSyncStatus('ok','Desat'); }
  catch(e){ setSyncStatus('err','Error'); showToast('Error en desar'); }
}

async function dbDeletePerson(id){
  setSyncStatus('busy','Eliminant...');
  try{
    await db.collection('people').doc(id).delete();
    const [s1,s2]=await Promise.all([db.collection('relations').where('a','==',id).get(),db.collection('relations').where('b','==',id).get()]);
    const b=db.batch();
    s1.docs.forEach(d=>b.delete(d.ref)); s2.docs.forEach(d=>b.delete(d.ref));
    await b.commit(); setSyncStatus('ok','Eliminat');
  }catch(e){ setSyncStatus('err','Error'); }
}

async function dbSaveRelation(rel){
  setSyncStatus('busy','Desant...');
  try{
    const{firestoreId,...d}=rel;
    if(firestoreId) await db.collection('relations').doc(firestoreId).set(d);
    else await db.collection('relations').add(d);
    setSyncStatus('ok','Desat');
  }catch(e){ setSyncStatus('err','Error'); showToast('Error en desar relació'); }
}

async function dbDeleteRelation(fid){
  setSyncStatus('busy','Eliminant...');
  try{ await db.collection('relations').doc(fid).delete(); setSyncStatus('ok','Eliminat'); }
  catch(e){ setSyncStatus('err','Error'); }
}

// ── RENDER ──
function renderAll(){ renderNodes(); renderConnectors(); renderSidebar(); updateStats(); renderSnapLines(); }

function renderNodes(){
  const vp=document.getElementById('tree-viewport');
  vp.innerHTML='';
  for(const id in people){
    const p=people[id];
    const el=document.createElement('div');
    el.className='person-node'+(id===selectedId?' selected':'');
    el.id='node-'+id;
    el.style.left=(p.x||0)+'px';
    el.style.top=(p.y||0)+'px';
    const ini=((p.name||'')[0]||'').toUpperCase()+((p.surname||'')[0]||'').toUpperCase()||'?';
    const gDot=p.gender?`<span class="gender-tag gender-${p.gender}"></span>`:'';
    const bY=p.birth?p.birth.split('-')[0]:'';
    const dY=p.death?p.death.split('-')[0]:'';
    const dateStr=bY?(dY?`${bY} – ${dY}`:`n. ${bY}`):'';
    const dead=!!p.death;
    const cross=dead?`<span class="deceased-cross"><svg width="10" height="13" viewBox="0 0 10 13" fill="none"><line x1="5" y1="0" x2="5" y2="13" stroke="#9c9183" stroke-width="1.5"/><line x1="1" y1="3.5" x2="9" y2="3.5" stroke="#9c9183" stroke-width="1.5"/></svg></span>`:'';
    el.innerHTML=`
      <div class="node-avatar${dead?' deceased-avatar':''}">
        ${p.photo?`<img src="${p.photo}" alt="">`:ini}
      </div>
      <div class="node-name">${gDot}${p.name||''}${p.surname?`<br><span style="font-weight:600;font-size:13px;color:var(--text)">${p.surname}</span>`:''}</div>
      ${dateStr||dead?`<div class="node-dates">${cross}${dateStr}</div>`:''}
      <div class="node-actions">
        <button class="node-action-btn" data-action="edit" title="Editar">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 2l3 3-8 8H3v-3L11 2z"/></svg>
        </button>
        <button class="node-action-btn del" data-action="del" title="Eliminar">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="2,4 14,4"/><path d="M5 4V2h6v2"/><rect x="3" y="4" width="10" height="10" rx="1"/></svg>
        </button>
      </div>`;
    el.querySelectorAll('[data-action]').forEach(btn=>{
      btn.addEventListener('mousedown',e=>{ if(!pickMode) e.stopPropagation(); });
      btn.addEventListener('click',e=>{
        if(pickMode){ e.stopPropagation(); handlePickClick(id); return; }
        e.stopPropagation();
        if(btn.dataset.action==='edit') startEdit(id);
        if(btn.dataset.action==='del'&&confirm('Eliminar a '+p.name+'?')) deletePerson(id);
      });
    });
    let mdPos=null;
    el.addEventListener('mousedown',e=>{
      if(e.button!==0)return;
      if(pickMode){ console.log('[PICK] mousedown on node', id); return; }
      mdPos={x:e.clientX,y:e.clientY};
      startDrag(e,id);
    });
    el.addEventListener('click',e=>{
      e.stopPropagation();
      console.log('[NODE click] id=', id, 'pickMode=', pickMode, 'mdPos=', mdPos);
      if(pickMode){ handlePickClick(id); return; }
      if(!mdPos)return;
      const dist=Math.hypot(e.clientX-mdPos.x,e.clientY-mdPos.y);
      mdPos=null;
      if(dist>5)return;

    });
    el.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();openCtx(e,id);});
    vp.appendChild(el);
  }
  applyTransform();
  // Re-apply multi-select highlights
  applySelectionClasses();
}

function renderConnectors(){
  const svg=document.getElementById('svg-connectors');
  svg.innerHTML='';
  const NW=140,NH=155,R=7;
  // Use display positions: _ffx/_ffy during family focus, else real x/y
  const px=p=>p._ffx!==undefined?p._ffx:(p.x||0);
  const py=p=>p._ffy!==undefined?p._ffy:(p.y||0);
  const ncx=p=>px(p)+NW/2, ncy=p=>py(p)+NH/2;
  const nbot=p=>py(p)+NH, ntop=p=>py(p);

  // Helper: path data depending on lineMode
  function pathD(ox,oy,dx,dy){
    if(lineMode==='curved'){
      const midY=oy+(dy-oy)*0.5;
      return `M ${ox} ${oy} C ${ox} ${midY}, ${dx} ${midY}, ${dx} ${dy}`;
    }else{
      // Orthogonal: down from origin, then horizontal, then down to dest
      const midY=(oy+dy)/2;
      return `M ${ox} ${oy} L ${ox} ${midY} L ${dx} ${midY} L ${dx} ${dy}`;
    }
  }
  function couplePathD(ax,ay,bx,by){
    if(lineMode==='curved'){
      const mx=(ax+bx)/2,my=(ay+by)/2;
      return `M ${ax} ${ay} Q ${mx} ${my-20}, ${bx} ${by}`;
    }else{
      const midX=(ax+bx)/2;
      return `M ${ax} ${ay} L ${midX} ${ay} L ${midX} ${by} L ${bx} ${by}`;
    }
  }

  // Precompute couple rings midpoints
  const coupleRings={};
  relations.forEach(rel=>{
    if(rel.type!=='couple')return;
    if(familyFocusSet&&(!familyFocusSet.has(rel.a)||!familyFocusSet.has(rel.b)))return;
    const a=people[rel.a],b=people[rel.b];
    if(!a||!b)return;
    const ax=ncx(a),ay=ncy(a),bx=ncx(b),by=ncy(b);
    const mx=(ax+bx)/2,my=(ay+by)/2-20;
    const cmx=0.25*ax+0.5*mx+0.25*bx;
    const cmy=0.25*ay+0.5*my+0.25*by;
    coupleRings[[rel.a,rel.b].sort().join('|')]={rx:cmx,ry:cmy};
  });

  // Draw couple lines + rings
  relations.forEach(rel=>{
    if(rel.type!=='couple')return;
    if(familyFocusSet&&(!familyFocusSet.has(rel.a)||!familyFocusSet.has(rel.b)))return;
    const a=people[rel.a],b=people[rel.b];
    if(!a||!b)return;
    const ax=ncx(a),ay=ncy(a),bx=ncx(b),by=ncy(b);
    const line=document.createElementNS('http://www.w3.org/2000/svg','path');
    line.setAttribute('d',couplePathD(ax,ay,bx,by));
    line.setAttribute('class','connector-couple');
    svg.appendChild(line);
    const ov=4,angle=Math.atan2(by-ay,bx-ax);
    const key=[rel.a,rel.b].sort().join('|');
    const{rx:cmx,ry:cmy}=coupleRings[key];
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    [[cmx-(ov/2)*Math.cos(angle),cmy-(ov/2)*Math.sin(angle),'#b8945a'],[cmx+(ov/2)*Math.cos(angle),cmy+(ov/2)*Math.sin(angle),'#c4933a']].forEach(([cx,cy,st])=>{
      const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r',R);
      c.setAttribute('fill','var(--bg)');c.setAttribute('stroke',st);c.setAttribute('stroke-width','1.8');
      g.appendChild(c);
    });
    svg.appendChild(g);
  });

  // Build child→parents map (filtered by focusSet if active)
  const childParents={};
  relations.forEach(rel=>{
    if(rel.type!=='parent-child')return;
    if(familyFocusSet&&(!familyFocusSet.has(rel.a)||!familyFocusSet.has(rel.b)))return;
    if(!childParents[rel.b])childParents[rel.b]=[];
    childParents[rel.b].push(rel.a);
  });

  const drawnChildren=new Set();
  relations.forEach(rel=>{
    if(rel.type!=='parent-child')return;
    if(familyFocusSet&&(!familyFocusSet.has(rel.a)||!familyFocusSet.has(rel.b)))return;
    const childId=rel.b;
    if(drawnChildren.has(childId))return;
    drawnChildren.add(childId);
    const child=people[childId];
    if(!child)return;
    const parents=(childParents[childId]||[]).map(id=>people[id]).filter(Boolean);
    const dx=ncx(child),dy=ntop(child);
    if(parents.length===0)return;
    if(parents.length>=2){
      const coupleKey=[childParents[childId][0],childParents[childId][1]].sort().join('|');
      if(coupleRings[coupleKey]){
        const{rx,ry}=coupleRings[coupleKey];
        const ox=rx,oy=ry+R+2;
        const path=document.createElementNS('http://www.w3.org/2000/svg','path');
        path.setAttribute('d',pathD(ox,oy,dx,dy));
        path.setAttribute('class','connector-line');
        svg.appendChild(path);
      }else{
        parents.forEach(par=>{
          const ox=ncx(par),oy=nbot(par);
          const path=document.createElementNS('http://www.w3.org/2000/svg','path');
          path.setAttribute('d',pathD(ox,oy,dx,dy));
          path.setAttribute('class','connector-line');
          svg.appendChild(path);
        });
      }
    }else{
      const par=parents[0];
      const ox=ncx(par),oy=nbot(par);
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',pathD(ox,oy,dx,dy));
      path.setAttribute('class','connector-line');
      svg.appendChild(path);
    }
  });
}

let familyPickPending=false;
let familyFocusSavedPositions={}; // id → {x,y} snapshot before focus layout

function applyFamilyFocus(rootId){
  familyFocusId=rootId;
  const p=people[rootId]; if(!p)return;

  function getParents(id){ return relations.filter(r=>r.type==='parent-child'&&r.b===id).map(r=>r.a); }
  function getChildren(id){ return relations.filter(r=>r.type==='parent-child'&&r.a===id).map(r=>r.b); }
  function getPartners(id){ return relations.filter(r=>r.type==='couple'&&(r.a===id||r.b===id)).map(r=>r.a===id?r.b:r.a); }

  // BFS up — ancestors
  const ancestors=new Set();
  const ancestorGen={};
  ancestorGen[rootId]=0;
  const upQueue=[rootId];
  while(upQueue.length){
    const cur=upQueue.shift();
    const curGen=ancestorGen[cur]||0;
    getParents(cur).forEach(pid=>{
      if(!ancestors.has(pid)){
        ancestors.add(pid);
        ancestorGen[pid]=curGen-1;
        upQueue.push(pid);
      }
    });
  }

  // BFS down — descendants
  const descendants=new Set();
  const descGen={};
  descGen[rootId]=0;
  const downQueue=[rootId];
  while(downQueue.length){
    const cur=downQueue.shift();
    const curGen=descGen[cur]||0;
    getChildren(cur).forEach(cid=>{
      if(!descendants.has(cid)){
        descendants.add(cid);
        descGen[cid]=curGen+1;
        downQueue.push(cid);
      }
    });
  }

  // Build visible set: root + ancestors + descendants
  // Partners: ONLY the person who is parent of someone already in focusSet via direct line.
  // i.e. for each person P in focusSet, find X such that X is parent of some Q in focusSet,
  // and X is NOT already in focusSet (they are not on the direct line themselves).
  const focusSet=new Set([rootId,...ancestors,...descendants]);
  const partnerOf=new Set();

  // For each person in the direct line, find their OTHER parent (the one not in the line)
  // A "line parent" of Q is someone in focusSet who has a parent-child relation to Q.
  // The "missing parent" of Q is someone NOT in focusSet who also has parent-child to Q.
  focusSet.forEach(childId=>{
    const parentsOfChild=relations.filter(r=>r.type==='parent-child'&&r.b===childId).map(r=>r.a);
    parentsOfChild.forEach(pid=>{
      if(!focusSet.has(pid)&&people[pid]){
        focusSet.add(pid);
        partnerOf.add(pid);
      }
    });
  });

  const allGen={...ancestorGen,...descGen};
  partnerOf.forEach(pid=>{
    // Find a child of pid that is already in allGen → assign same generation as that child's other parent
    const myChild=relations.find(r=>r.type==='parent-child'&&r.a===pid&&allGen[r.b]!==undefined);
    if(myChild) allGen[pid]=allGen[myChild.b]-1;
    else{
      // fallback: same gen as whoever is already in focusSet and shares a child
      const sibling=relations.find(r=>r.type==='parent-child'&&r.b===relations.find(r2=>r2.type==='parent-child'&&r2.a===pid)?.b&&allGen[r.a]!==undefined&&r.a!==pid);
      if(sibling) allGen[pid]=allGen[sibling.a];
    }
  });

  // ── Save original positions (snapshot) — do NOT touch people[id].x/y ──
  familyFocusSavedPositions={};
  Object.keys(people).forEach(id=>{
    familyFocusSavedPositions[id]={x:people[id].x||0,y:people[id].y||0};
  });

  // ── Compute display-only layout ──
  const NW=140,NH=155,HGAP=60,VGAP=80;
  const byGen={};
  focusSet.forEach(id=>{
    const g=allGen[id]!==undefined?allGen[id]:0;
    if(!byGen[g])byGen[g]=[];
    byGen[g].push(id);
  });
  const gens=Object.keys(byGen).map(Number).sort((a,b)=>a-b);

  const wrap=document.getElementById('canvas-wrap').getBoundingClientRect();
  const cx=(wrap.width/2-vx)/vscale;

  // Move only the DOM node (style.left/top) — never touch people[id].x/y
  gens.forEach((g,i)=>{
    const rowY=100+(i*(NH+VGAP));
    const ids=byGen[g];
    const rowW=ids.length*(NW+HGAP)-HGAP;
    const startX=cx-rowW/2;
    ids.forEach((id,j)=>{
      const nx=Math.round(startX+j*(NW+HGAP));
      const ny=Math.round(rowY);
      const node=document.getElementById('node-'+id);
      if(node){node.style.left=nx+'px';node.style.top=ny+'px';}
      people[id]._ffx=nx; people[id]._ffy=ny;
    });
  });

  // Apply classes — hide non-focus nodes entirely (no opacity, just hidden)
  document.querySelectorAll('.person-node').forEach(n=>{
    const id=n.id.replace('node-','');
    n.classList.remove('ff-focus','ff-dim','ff-ancestor','ff-child');
    if(!focusSet.has(id)){ n.style.display='none'; return; }
    n.style.display='';
    if(id===rootId) n.classList.add('ff-focus');
    else if(ancestors.has(id)||partnerOf.has(id)) n.classList.add('ff-ancestor');
    else if(descendants.has(id)) n.classList.add('ff-child');
    else n.classList.add('ff-ancestor');
  });

  familyFocusSet=focusSet;
  renderConnectors();

  document.getElementById('ff-banner').classList.add('active');
  document.getElementById('ff-label').textContent=`Vista de ${p.name} ${p.surname||''} — ${ancestors.size} avantpassats · ${descendants.size} descendents`;
  document.getElementById('btn-ff').classList.add('primary');
}

function closeFamilyFocus(){
  // Restore all original positions to DOM
  Object.keys(familyFocusSavedPositions).forEach(id=>{
    const saved=familyFocusSavedPositions[id];
    const node=document.getElementById('node-'+id);
    if(node){node.style.left=saved.x+'px';node.style.top=saved.y+'px';}
    if(people[id]){
      people[id].x=saved.x;
      people[id].y=saved.y;
      delete people[id]._ffx;
      delete people[id]._ffy;
    }
  });
  familyFocusSavedPositions={};
  familyFocusId=null;
  familyFocusSet=null;
  document.querySelectorAll('.person-node').forEach(n=>{
    n.style.display='';
    n.classList.remove('ff-focus','ff-dim','ff-ancestor','ff-child');
  });
  renderConnectors();
  document.getElementById('ff-banner').classList.remove('active');
  document.getElementById('btn-ff').classList.remove('primary');
}

// ── GENERATION SNAP ──
let snapEnabled=false;
const SNAP_THRESH=28; // px in viewport coords — how close before snapping
const GEN_STEP=235;   // default vertical distance between generation lines (px in viewport)
const NODE_H=155;

// Generation lines are "virtual" horizontal rails at y positions inferred from data
// We compute them live from the actual Y positions of all nodes clustered into bands.
// Extra: user can also snap to the nearest existing cluster.

function toggleSnap(){
  snapEnabled=!snapEnabled;
  const btn=document.getElementById('btn-snap');
  btn.classList.toggle('primary',snapEnabled);
  renderSnapLines();
  if(snapEnabled) showToast('Snap per generació activat — arrossega un node');
  else{ clearSnapLines(); showToast('Snap desactivat'); }
}

// Compute generation Y bands from current node positions (simple 1D clustering)
function computeGenBands(){
  const ys=Object.values(people).map(p=>p.y||0).sort((a,b)=>a-b);
  if(!ys.length)return[];
  const bands=[];
  let band=[ys[0]];
  for(let i=1;i<ys.length;i++){
    if(ys[i]-ys[i-1]<NODE_H*0.7) band.push(ys[i]);
    else{ bands.push(band); band=[ys[i]]; }
  }
  bands.push(band);
  return bands.map(b=>Math.round(b.reduce((s,v)=>s+v,0)/b.length));
}

function renderSnapLines(){
  const overlay=document.getElementById('snap-overlay');
  overlay.innerHTML='';
  if(!snapEnabled)return;
  const bands=computeGenBands();
  bands.forEach((y,i)=>{
    const line=document.createElement('div');
    line.className='gen-line';
    line.id='gen-line-'+i;
    // Position in screen coords: translate from viewport
    const screenY=y*vscale+vy;
    line.style.top=screenY+'px';
    line.style.opacity='0.45';
    const lbl=document.createElement('div');
    lbl.className='gen-line-label';
    lbl.textContent='Gen '+(i+1);
    lbl.style.opacity='0.6';
    line.appendChild(lbl);
    overlay.appendChild(line);
  });
}

function updateSnapLinePositions(){
  if(!snapEnabled)return;
  const bands=computeGenBands();
  bands.forEach((y,i)=>{
    const line=document.getElementById('gen-line-'+i);
    if(line) line.style.top=(y*vscale+vy)+'px';
  });
}

function clearSnapLines(){
  document.getElementById('snap-overlay').innerHTML='';
  document.getElementById('snap-ghost').classList.remove('show');
}

// Snap a raw Y (viewport coords) to nearest generation band. Returns snapped Y or original.
function snapYToGen(rawY){
  if(!snapEnabled)return rawY;
  const bands=computeGenBands();
  // Also consider a new line above the topmost and below the bottommost (GEN_STEP spacing)
  const extended=[...bands];
  if(bands.length>0){
    extended.unshift(bands[0]-GEN_STEP);
    extended.push(bands[bands.length-1]+GEN_STEP);
  }else{
    extended.push(0,GEN_STEP,GEN_STEP*2);
  }
  let best=null,bestDist=Infinity;
  extended.forEach(by=>{
    const d=Math.abs(rawY-by);
    if(d<bestDist){bestDist=d;best=by;}
  });
  if(bestDist<SNAP_THRESH){
    showSnapGhost(best);
    return best;
  }
  hideSnapGhost();
  return rawY;
}

function showSnapGhost(yViewport){
  const ghost=document.getElementById('snap-ghost');
  ghost.style.top=(yViewport*vscale+vy)+'px';
  ghost.classList.add('show');
}
function hideSnapGhost(){
  document.getElementById('snap-ghost').classList.remove('show');
}
function canvasToViewport(cx,cy){
  return{x:(cx-vx)/vscale,y:(cy-vy)/vscale};
}
function startRectSel(e){
  const wrap=document.getElementById('canvas-wrap').getBoundingClientRect();
  rectStart={x:e.clientX-wrap.left,y:e.clientY-wrap.top};
  rectCur={...rectStart};
  rectSelecting=true;
  const rs=document.getElementById('rect-sel');
  rs.style.display='block';
  rs.style.left=rectStart.x+'px'; rs.style.top=rectStart.y+'px';
  rs.style.width='0px'; rs.style.height='0px';
  document.addEventListener('mousemove',doRectSel);
  document.addEventListener('mouseup',endRectSel);
}
function doRectSel(e){
  if(!rectSelecting)return;
  const wrap=document.getElementById('canvas-wrap').getBoundingClientRect();
  rectCur={x:e.clientX-wrap.left,y:e.clientY-wrap.top};
  const x=Math.min(rectStart.x,rectCur.x),y=Math.min(rectStart.y,rectCur.y);
  const w=Math.abs(rectCur.x-rectStart.x),h=Math.abs(rectCur.y-rectStart.y);
  const rs=document.getElementById('rect-sel');
  rs.style.left=x+'px'; rs.style.top=y+'px'; rs.style.width=w+'px'; rs.style.height=h+'px';
}
function endRectSel(e){
  if(!rectSelecting)return;
  rectSelecting=false;
  document.getElementById('rect-sel').style.display='none';
  document.removeEventListener('mousemove',doRectSel);
  document.removeEventListener('mouseup',endRectSel);
  const wrap=document.getElementById('canvas-wrap').getBoundingClientRect();
  const x1=Math.min(rectStart.x,rectCur.x),y1=Math.min(rectStart.y,rectCur.y);
  const x2=Math.max(rectStart.x,rectCur.x),y2=Math.max(rectStart.y,rectCur.y);
  if(x2-x1<4&&y2-y1<4){ selectedIds.clear(); applySelectionClasses(); return; }
  // Convert to viewport coords
  const vp1=canvasToViewport(x1,y1),vp2=canvasToViewport(x2,y2);
  selectedIds.clear();
  const NW=140,NH=155;
  Object.values(people).forEach(p=>{
    const px=p.x||0,py=p.y||0;
    if(px+NW>vp1.x&&px<vp2.x&&py+NH>vp1.y&&py<vp2.y) selectedIds.add(p.id);
  });
  applySelectionClasses();
  if(selectedIds.size>0) showToast(`${selectedIds.size} persones seleccionades`);
}
function applySelectionClasses(){
  document.querySelectorAll('.person-node').forEach(n=>{
    const id=n.id.replace('node-','');
    n.classList.toggle('in-sel',selectedIds.has(id));
  });
}

// ── MULTI-DRAG ──
function startMultiDrag(e,id){
  // Called when mousedown on a node that's in selectedIds
  multiDragging=true;
  multiDragOffsets={};
  selectedIds.forEach(sid=>{
    const p=people[sid];
    multiDragOffsets[sid]={ox:e.clientX/vscale-p.x,oy:e.clientY/vscale-p.y};
  });
  document.getElementById('node-'+id)?.classList.add('dragging');
  document.addEventListener('mousemove',doMultiDrag);
  document.addEventListener('mouseup',endMultiDrag);
}
function doMultiDrag(e){
  if(!multiDragging)return;
  selectedIds.forEach(sid=>{
    const p=people[sid];
    const off=multiDragOffsets[sid];
    p.x=Math.round(e.clientX/vscale-off.ox);
    p.y=Math.round(e.clientY/vscale-off.oy);
    const node=document.getElementById('node-'+sid);
    if(node){node.style.left=p.x+'px';node.style.top=p.y+'px';}
  });
  renderConnectors();
}
function endMultiDrag(){
  if(!multiDragging)return;
  multiDragging=false;
  document.querySelectorAll('.person-node').forEach(n=>n.classList.remove('dragging'));
  clearTimeout(multiDragSaveTimer);
  multiDragSaveTimer=setTimeout(()=>{
    const b=db.batch();
    selectedIds.forEach(sid=>{ const{id,...d}=people[sid]; b.update(db.collection('people').doc(id),{x:d.x,y:d.y}); });
    b.commit().catch(console.error);
  },600);
  document.removeEventListener('mousemove',doMultiDrag);
  document.removeEventListener('mouseup',endMultiDrag);
}

function updateStats(){
  document.getElementById('stat-total').textContent=Object.keys(people).length;

  Object.keys(people).filter(id=>!relations.some(r=>r.type==='parent-child'&&r.b===id)).forEach(id=>depth(id,1));
  document.getElementById('stat-gen').textContent=Object.keys(people).length>0?(maxD||1):0;
}

    const id=generateId();

    dbSavePerson({id,name,surname:document.getElementById('f-surname').value.trim(),birth:document.getElementById('f-birth').value,death:document.getElementById('f-death').value,gender:document.getElementById('f-gender').value,birthplace:document.getElementById('f-birthplace').value.trim(),photo:pendingPhoto||null,x:Math.round((rect.width/2-vx)/vscale-70),y:Math.round((rect.height/2-vy)/vscale-80)});
    showToast('Persona afegida');
  }
  closeModal();
}
function resetPhotoPreview(){ document.getElementById('photo-preview-inner').innerHTML=`<svg width="24" height="24" viewBox="0 0 16 16" fill="none" stroke="var(--text3)" stroke-width="1.5" style="margin-bottom:4px"><rect x="1" y="3" width="14" height="10" rx="2"/><circle cx="8" cy="8" r="2.5"/><path d="M5 3l1-2h4l1 2"/></svg><div class="photo-upload-text">Foto</div>`; }

// ── PHOTO ──
function handlePhotoUpload(e){
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{ pendingPhoto=ev.target.result; document.getElementById('photo-preview-inner').innerHTML=`<img src="${pendingPhoto}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`; };
  reader.readAsDataURL(file);
}
function profilePhotoUpload(){
  if(!profileId)return;
  const input=document.createElement('input'); input.type='file'; input.accept='image/*';
  input.onchange=e=>{
    const file=e.target.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const p=people[profileId]; if(!p)return;
      dbSavePerson({...p,photo:ev.target.result});
      document.getElementById('pm-photo').innerHTML=`<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover">`;
      showToast('Foto actualitzada');
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

// ── RELATION PANEL ──
function openRelPanel(preselectId){
  relPanelOpen=true;
  document.getElementById('rel-panel').style.transform='translateX(0)';
  document.getElementById('rel-panel-overlay').style.display='block';
  document.getElementById('btn-rel').classList.add('primary');
  const sel=document.getElementById('rp-person');
  const current=preselectId||sel.value||selectedId||Object.keys(people)[0]||'';
  sel.innerHTML=Object.values(people).sort((a,b)=>(a.name+a.surname).localeCompare(b.name+b.surname))
    .map(p=>`<option value="${p.id}"${p.id===current?' selected':''}>${p.name} ${p.surname||''}</option>`).join('');
  renderRelPanel();
}
function closeRelPanel(){
  if(pickMode)cancelPickMode();
  relPanelOpen=false;
  document.getElementById('rel-panel').style.transform='translateX(100%)';
  document.getElementById('rel-panel-overlay').style.display='none';
  document.getElementById('btn-rel').classList.remove('primary');
}

function renderRelPanel(){
  const personId=document.getElementById('rp-person').value;
  const p=people[personId]; if(!p)return;
  document.getElementById('rp-title').textContent=`${p.name} ${p.surname||''}`;

  const myRels=relations.filter(r=>r.a===personId||r.b===personId);
  const couples=myRels.filter(r=>r.type==='couple');
  const asParent=myRels.filter(r=>r.type==='parent-child'&&r.a===personId); // children
  const asChild=myRels.filter(r=>r.type==='parent-child'&&r.b===personId);  // my parents

  const body=document.getElementById('rp-body');
  body.innerHTML='';

  function pName(id){ const x=people[id]; return x?`${x.name}${x.surname?' '+x.surname:''}`:id; }

  function mkAvatar(id){
    const x=people[id];
    return x?.photo?`<img src="${x.photo}" style="width:100%;height:100%;object-fit:cover">`
      :((x?.name||'')[0]||'?').toUpperCase();
  }

  function mkRow(rel, otherId, onClickRow){
    const row=document.createElement('div');
    row.className='rp-row';
    row.innerHTML=`
      <div style="display:flex;align-items:center;gap:8px;min-width:0">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:var(--accent);flex-shrink:0;overflow:hidden">${mkAvatar(otherId)}</div>
        <span style="font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${pName(otherId)}</span>
      </div>
      <button class="rp-del" title="Eliminar">
        <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="3" x2="13" y2="13"/><line x1="13" y1="3" x2="3" y2="13"/></svg>
      </button>`;
    row.querySelector('.rp-del').addEventListener('click', async e=>{
      e.stopPropagation();
      if(!confirm(`Eliminar relació amb ${pName(otherId)}?`))return;
      await dbDeleteRelation(rel.firestoreId);
      renderRelPanel();
    });
    if(onClickRow) row.addEventListener('click', ()=>onClickRow(otherId));
    return row;
  }

  function mkSection(title, icon, items, otherId_fn, addLabel, addRelType, addLabel2){
    const sec=document.createElement('div');
    sec.style.marginBottom='20px';
    const hdr=document.createElement('div');
    hdr.className='rp-section-header';
    hdr.innerHTML=`<div class="rp-section-title">
      <span style="opacity:.5">${icon}</span>
      <span style="font-size:11px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.05em">${title}</span>
    </div>`;
    const addBtn=document.createElement('button');
    addBtn.className='rp-add-btn';
    addBtn.innerHTML=`<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="8" y1="3" x2="8" y2="13"/><line x1="3" y1="8" x2="13" y2="8"/></svg> ${addLabel}`;
    addBtn.addEventListener('click',()=>startPickMode(addRelType, addLabel2||addLabel));
    hdr.appendChild(addBtn);
    sec.appendChild(hdr);
    if(!items.length){
      const em=document.createElement('div'); em.className='rp-empty';
      em.textContent='Sense registre'; sec.appendChild(em);
    }else{
      items.forEach(rel=>{
        const otherId=otherId_fn(rel);
        sec.appendChild(mkRow(rel,otherId,navId=>{
          document.getElementById('rp-person').value=navId; renderRelPanel();
        }));
      });
    }
    return sec;
  }

  const icoAnell=`<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#c4933a" stroke-width="1.8"><circle cx="5" cy="8" r="3.5"/><circle cx="11" cy="8" r="3.5"/></svg>`;
  const icoPare=`<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="4" r="2.5"/><path d="M4 14c0-3 8-3 8 0"/></svg>`;
  const icoFill=`<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="12" r="2.5"/><path d="M4 2c0 3 8 3 8 0"/></svg>`;

  body.appendChild(mkSection('Parella', icoAnell, couples, rel=>rel.a===personId?rel.b:rel.a, 'Afegir', 'couple', 'Clica la parella de '+p.name));
  body.appendChild(mkSection('Pares', icoPare, asChild, rel=>rel.a, 'Afegir', 'parent-child-reverse', 'Clica un pare/mare de '+p.name));
  body.appendChild(mkSection('Fills/es', icoFill, asParent, rel=>rel.b, 'Afegir', 'parent-child', 'Clica un fill/a de '+p.name));
}

// ── CONTEXT MENU ──
function openCtx(e,id){ ctxTarget=id; const m=document.getElementById('ctx-menu'); m.style.left=e.clientX+'px'; m.style.top=e.clientY+'px'; m.classList.add('open'); }
function closeCtx(){ document.getElementById('ctx-menu').classList.remove('open'); ctxTarget=null; }
function ctxEdit(){ if(ctxTarget)startEdit(ctxTarget); closeCtx(); }
function ctxRelations(){ if(ctxTarget)openRelPanel(ctxTarget); closeCtx(); }
function ctxPhoto(){ if(ctxTarget)openProfileModal(ctxTarget); closeCtx(); }
function ctxDelete(){ if(ctxTarget&&confirm('Eliminar?'))deletePerson(ctxTarget); closeCtx(); }
document.addEventListener('click',e=>{ if(!document.getElementById('ctx-menu').contains(e.target))closeCtx(); });

// ── DRAG ──
function startDrag(e,id){
  if(e.button!==0)return; e.stopPropagation();
  // If this node is part of a multi-selection, do multi-drag
  if(selectedIds.has(id)&&selectedIds.size>1){
    startMultiDrag(e,id);
    return;
  }
  dragging=id; const p=people[id];
  dragOffset={x:e.clientX/vscale-p.x,y:e.clientY/vscale-p.y};
  document.getElementById('node-'+id).classList.add('dragging');
  document.addEventListener('mousemove',onDrag); document.addEventListener('mouseup',endDrag);
}
function onDrag(e){
  if(!dragging)return; const p=people[dragging];
  const rawX=Math.round(e.clientX/vscale-dragOffset.x);
  const rawY=Math.round(e.clientY/vscale-dragOffset.y);
  p.x=rawX;
  p.y=snapYToGen(rawY);
  const node=document.getElementById('node-'+dragging);
  if(node){ node.style.left=p.x+'px'; node.style.top=p.y+'px'; }
  renderConnectors();
}
function endDrag(){
  if(dragging){
    const id=dragging,p=people[id];
    clearTimeout(dragSaveTimer); dragSaveTimer=setTimeout(()=>dbSavePerson(p),600);
    document.getElementById('node-'+id)?.classList.remove('dragging'); dragging=null;
    hideSnapGhost();
    renderSnapLines(); // recompute bands after drop
  }
  document.removeEventListener('mousemove',onDrag); document.removeEventListener('mouseup',endDrag);
}

// ── PAN & ZOOM ──
function startPan(e){ 
  if(dragging||pickMode||e.button!==0)return; 
  if(e.shiftKey){ startRectSel(e); return; }
  selectedIds.clear(); applySelectionClasses();
  panning=true; panStart={x:e.clientX,y:e.clientY}; panOrigin={x:vx,y:vy}; 
}
function doPan(e){ if(!panning||dragging)return; vx=panOrigin.x+(e.clientX-panStart.x); vy=panOrigin.y+(e.clientY-panStart.y); applyTransform(); }
function endPan(){ panning=false; }
function handleWheel(e){
  e.preventDefault(); const f=e.deltaY<0?1.1:0.9;
  const rect=document.getElementById('canvas-wrap').getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  vx=mx-(mx-vx)*f; vy=my-(my-vy)*f; vscale=Math.max(0.2,Math.min(2.5,vscale*f)); applyTransform();
}
function zoomIn(){ vscale=Math.min(2.5,vscale*1.15); applyTransform(); }
function zoomOut(){ vscale=Math.max(0.2,vscale/1.15); applyTransform(); }
function resetZoom(){ vscale=1; vx=160; vy=80; applyTransform(); }
function applyTransform(){
  document.getElementById('tree-viewport').style.transform=`translate(${vx}px,${vy}px) scale(${vscale})`;
  const svg=document.getElementById('tree-canvas');
  svg.style.transform=`translate(${vx}px,${vy}px) scale(${vscale})`;
  svg.style.transformOrigin='0 0';
  document.getElementById('zoom-label').textContent=Math.round(vscale*100)+'%';
  updateSnapLinePositions();
}

// ── SIDEBAR ──
function toggleSidebar(){
  sidebarOpen=!sidebarOpen;
  document.getElementById('sidebar').classList.toggle('collapsed',!sidebarOpen);
  document.getElementById('panel-reopen-btn').classList.toggle('visible',!sidebarOpen);
}

// ── LAYOUT ──
async function saveLayoutAsDefault(){
  setSyncStatus('busy','Desant vista...');
  try{
    const pos={};
    Object.values(people).forEach(p=>{ pos[p.id]={x:p.x||0,y:p.y||0}; });
    await db.collection('meta').doc('layout').set({positions:pos,savedAt:Date.now()});
    setSyncStatus('ok','Vista desada'); showToast('Vista predeterminada desada');
  }catch(e){ setSyncStatus('err','Error'); showToast('Error en desar la vista'); }
}
async function loadSavedLayout(){
  try{
    const doc=await db.collection('meta').doc('layout').get();
    if(!doc.exists)return false;
    const{positions}=doc.data(); if(!positions)return false;
    Object.keys(positions).forEach(id=>{ if(people[id]){people[id].x=positions[id].x;people[id].y=positions[id].y;} });
    return true;
  }catch(e){ return false; }
}
async function autoLayout(){
  const hasSaved=await loadSavedLayout();
  if(hasSaved){ vx=40;vy=40;renderAll();showToast('Vista predeterminada carregada');return; }
  const NW=150,NH=195,HG=50,VG=80;
  const getChildren=id=>relations.filter(r=>r.type==='parent-child'&&r.a===id).map(r=>r.b);
  const getPartner=id=>{ const r=relations.find(r=>r.type==='couple'&&(r.a===id||r.b===id)); return r?(r.a===id?r.b:r.a):null; };
  const roots=Object.keys(people).filter(id=>!relations.some(r=>r.type==='parent-child'&&r.b===id));
  let col=0; const visited=new Set();
  function place(id,gen){
    if(visited.has(id))return; visited.add(id);
    const partner=getPartner(id);
    people[id].x=col*(NW+HG); people[id].y=gen*(NH+VG);
    if(partner&&!visited.has(partner)){ col++;visited.add(partner);people[partner].x=col*(NW+HG);people[partner].y=gen*(NH+VG); }
    const children=[...new Set([...getChildren(id),...(partner?getChildren(partner):[])])].filter(c=>!visited.has(c));
    if(children.length){children.forEach(cid=>{place(cid,gen+1);col++;});col--;}else{col++;}
  }
  roots.forEach(id=>place(id,0));
  Object.keys(people).filter(id=>!visited.has(id)).forEach(id=>{people[id].x=col*(NW+HG);people[id].y=0;col++;});
  const b=db.batch();
  Object.values(people).forEach(p=>b.update(db.collection('people').doc(p.id),{x:p.x,y:p.y}));
  b.commit().catch(console.error);
  vx=40;vy=40;renderAll();showToast('Arbre reorganitzat');
}

// ── EXPORT ──
function exportData(){
  const blob=new Blob([JSON.stringify({people:Object.values(people),relations},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='arbre.json'; a.click();
  showToast('Exportat com a JSON');
}

function filterList(){ renderSidebar(); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(pickMode){cancelPickMode();}else{closeModal();closeRelPanel();closeProfileModal();closeCtx();} }

});
document.getElementById('canvas-wrap').addEventListener('click',e=>{
  if(pickMode)return;
  if(e.target===document.getElementById('canvas-wrap')||e.target.classList.contains('canvas-grid')){
    selectedId=null; selectedIds.clear(); applySelectionClasses();
    document.querySelectorAll('.person-node').forEach(n=>n.classList.remove('selected'));
  }
});

startListening();
